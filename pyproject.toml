[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mythos"
version = "0.1.0"
description = "AI-assisted security audit & threat modeling: Gemini for repo-wide analysis, Claude Code for verification and patching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "audit", "threat-modeling", "sast", "dast", "gemini", "claude-code"]
dependencies = [
    "google-genai>=0.1.1",
    "pydantic>=2.0",
    "typer[all]>=0.9.0",
    "rich>=13.0",
    "python-dotenv>=1.0.0",
    "pathspec>=0.11.0",
    "httpx>=0.25",
    "pip-audit>=2.7",
]

[project.scripts]
mythos = "mythos.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mythos"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
